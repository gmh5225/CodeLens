name: Build

permissions:
  contents: write
  
on: [push, pull_request]

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goarch: arm64
            goos: windows
    steps:

    - name: Set up Go 1.x
      uses: actions/setup-go@v2
      with:
        go-version: ^1.22
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@v2

    - name: Get dependencies
      run: |
        go get -v -t -d ./...
        if [ -f Gopkg.toml ]; then
            curl https://raw.githubusercontent.com/golang/dep/master/install.sh | sh
            dep ensure
        fi

    - name: Build
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: |
        mkdir -p codelens-${{ matrix.goos }}-${{ matrix.goarch }}
        if [ "${{ matrix.goos }}" = "windows" ]; then
          go build -v -o codelens-${{ matrix.goos }}-${{ matrix.goarch }}/codelens.exe
        else
          go build -v -o codelens-${{ matrix.goos }}-${{ matrix.goarch }}/codelens
        fi
        cd codelens-${{ matrix.goos }}-${{ matrix.goarch }}
        if [ "${{ matrix.goos }}" = "windows" ]; then
          zip ../codelens-${{ matrix.goos }}-${{ matrix.goarch }}.zip codelens.exe
        else
          tar czf ../codelens-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz codelens
        fi
        cd ..

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: codelens-${{ matrix.goos }}-${{ matrix.goarch }}
        path: codelens-${{ matrix.goos }}-${{ matrix.goarch }}
    
    - name: Release
      uses: softprops/action-gh-release@v1
      if: ${{ startsWith(github.ref, 'refs/tags/') }}
      with:
        prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') || contains(github.ref, '-pre') }}
        files: |
          codelens-${{ matrix.goos }}-${{ matrix.goarch }}.zip
          codelens-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
